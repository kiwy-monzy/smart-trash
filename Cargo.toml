[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/rpc-common",
    "crates/shared-models",
    "crates/database",
    "crates/notifications",
    "crates/services",
    "crates/api-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
smarttrash-proto = { path = "crates/proto" }
rpc-common = { path = "crates/rpc-common" }
shared-models = { path = "crates/shared-models" }
database = { path = "crates/database" }
notifications = { path = "crates/notifications" }

tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tonic-web = "0.14"
prost = "0.14"
protoc-bin-vendored = "3"

tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
dotenvy = "0.15"
diesel = { version = "2.2", features = ["postgres"] }
diesel_migrations = { version = "2.2", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "catch-panic", "set-header", "timeout", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"

# Session tokens: HMAC-SHA256 signatures (gateway <-> RPC services).
hmac = "0.12"
sha2 = "0.10"
h3o = "0.11"

[profile.dev]
debug = 1
