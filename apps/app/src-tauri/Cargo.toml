[package]
name = "smart-trash-app"
version = "0.1.0"
description = "Smart Trash client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "smart_trash_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# This app is built on its own, not together with the backend workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-geolocation = "2"
tauri-plugin-haptics = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
